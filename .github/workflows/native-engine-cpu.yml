name: Native engine CPU reproducibility

on:
  pull_request:
    paths:
      - "engine/**"
      - "kernels/database/warm/**"
      - "kernels/database/codec/**"
      - "tools/viewport/native/**"
      - ".gitmodules"
      - ".github/workflows/native-engine-cpu.yml"
  push:
    branches:
      - "main"
    paths:
      - "engine/**"
      - "kernels/database/warm/**"
      - "kernels/database/codec/**"
      - "tools/viewport/native/**"
      - ".gitmodules"
      - ".github/workflows/native-engine-cpu.yml"
  workflow_dispatch:

jobs:
  projection-values:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and test projection and membership values without PostgreSQL or Taichi
        run: |
          cmake -S engine/tests/letter_projection -B /tmp/hcp-projection
          cmake --build /tmp/hcp-projection -j 2
          ctest --test-dir /tmp/hcp-projection --output-on-failure
  native-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Fetch pinned Taichi dependencies
        run: |
          if ! git submodule update --init --recursive; then
            # The pinned Eigen commit also exists in this mirror. Git still
            # checks out the exact gitlink SHA recorded by the repository.
            git -c 'url.https://github.com/eigen-mirror/eigen.git.insteadOf=https://gitlab.com/libeigen/eigen.git' \
              submodule update --init --recursive
          fi

      - name: Install recovered native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-15 llvm-15-dev ninja-build libx11-dev libpq-dev

      - name: Configure CPU-only Taichi fork
        run: |
          cmake -S engine/taichi -B engine/taichi/build-review -G Ninja             -DCMAKE_BUILD_TYPE=Release             -DCMAKE_C_COMPILER=/usr/lib/llvm-15/bin/clang             -DCMAKE_CXX_COMPILER=/usr/lib/llvm-15/bin/clang++             -DLLVM_DIR=/usr/lib/llvm-15/lib/cmake/llvm             -DCLANG_EXECUTABLE=/usr/lib/llvm-15/bin/clang             -DTI_WITH_PYTHON=OFF             -DTI_WITH_C_API=ON             -DTI_WITH_CUDA=OFF             -DTI_WITH_AMDGPU=OFF             -DTI_WITH_OPENGL=OFF             -DTI_WITH_VULKAN=OFF             -DTI_WITH_METAL=OFF             -DTI_WITH_DX11=OFF             -DTI_WITH_DX12=OFF             -DTI_WITH_GGUI=OFF             -DTI_WITH_BACKTRACE=OFF             -DTI_BUILD_TESTS=OFF             -DTI_BUILD_EXAMPLES=OFF             -DTI_BUILD_RHI_EXAMPLES=OFF

      - name: Build native Taichi CPU core
        run: |
          cmake --build engine/taichi/build-review             --target taichi_c_api -j 2
          test -f engine/taichi/build-review/libtaichi_core_static.a
          test -f engine/taichi/taichi/runtime/llvm/runtime_module/runtime_x64.bc

      - name: Configure HCP native engine against CPU Taichi
        run: |
          cmake -S engine -B engine/build -G Ninja             -DCMAKE_BUILD_TYPE=Release             -DCMAKE_CXX_COMPILER=/usr/lib/llvm-15/bin/clang++             -DENGINE_LLVM_CONFIG=/usr/lib/llvm-15/bin/llvm-config             -DENGINE_TAICHI_CUDA=OFF -DHCP_WITH_WARM_INTEGRATION=ON -DHCP_WITH_VIEWPORT=ON

      - name: Build HCP native engine
        run: |
          cmake --build engine/build -j 2

      - name: Ignore stale CUDA archives in a CPU Taichi build
        run: |
          for archive in \
            taichi/codegen/cuda/libcuda_codegen.a \
            taichi/runtime/cuda/libcuda_runtime.a \
            taichi/rhi/cuda/libcuda_rhi.a; do
            mkdir -p "engine/taichi/build-review/$(dirname "$archive")"
            touch "engine/taichi/build-review/$archive"
          done
          mkdir -p "$RUNNER_TEMP/taichi-runtime-probe"
          cp engine/taichi/taichi/runtime/llvm/runtime_module/runtime_x64.bc \
            "$RUNNER_TEMP/taichi-runtime-probe/runtime_x64.bc"
          touch "$RUNNER_TEMP/taichi-runtime-probe/runtime_cuda.bc"
          cmake -S engine -B engine/build-stale-probe -G Ninja \
            -DCMAKE_CXX_COMPILER=/usr/lib/llvm-15/bin/clang++ \
            -DENGINE_TAICHI_RUNTIME_SOURCE="$RUNNER_TEMP/taichi-runtime-probe" \
            -DENGINE_TAICHI_CUDA=AUTO > "$RUNNER_TEMP/backend-probe.log"
          grep -q 'Engine CUDA     : FALSE' "$RUNNER_TEMP/backend-probe.log"

      - name: Retain actual C3 compiler modules and configuration
        run: |
          . ./engine/build/engine-env.sh
          mkdir -p "$RUNNER_TEMP/c3-compiler-ir"
          /usr/lib/llvm-15/bin/clang++ --version > "$RUNNER_TEMP/c3-compiler-ir/toolchain.txt"
          /usr/lib/llvm-15/bin/llvm-config --version >> "$RUNNER_TEMP/c3-compiler-ir/toolchain.txt"
          cmake -LA -N engine/build > "$RUNNER_TEMP/c3-compiler-ir/cmake.txt"
          for workers in 1 2; do
            for source_path in bulk direct; do
              for compiler_shape in default no-unroll; do
                hcp_ir_dir="$RUNNER_TEMP/c3-compiler-ir/${workers}-${source_path}-${compiler_shape}"
                mkdir -p "$hcp_ir_dir"
                hcp_ir_args=()
                if [ "$source_path" = direct ]; then hcp_ir_args+=(--direct); fi
                if [ "$compiler_shape" = no-unroll ]; then hcp_ir_args+=(--compiler-no-unroll); fi
                HCP_C3_IR_DIR="$hcp_ir_dir" engine/build/live_hierarchy_test \
                  --threads "$workers" --case ir "${hcp_ir_args[@]}" > "$hcp_ir_dir/collection.txt"
                engine/build/live_hierarchy_test --threads "$workers" \
                  --audit-ir "$hcp_ir_dir" "${hcp_ir_args[@]}" > "$hcp_ir_dir/audit.txt"
              done
            done
          done

      - uses: actions/upload-artifact@v4
        with:
          name: native-c3-compiler-ir
          path: ${{ runner.temp }}/c3-compiler-ir

      - name: Run native CPU functional suite
        run: |
          ctest --test-dir engine/build --output-on-failure --output-log "$RUNNER_TEMP/native-cpu-ctest.log"

      - name: Exercise all four hierarchy modes without LLVM loop duplication
        run: |
          . ./engine/build/engine-env.sh
          for workers in 1 2; do
            for source_path in bulk direct; do
              hcp_ir_args=()
              if [ "$source_path" = direct ]; then hcp_ir_args+=(--direct); fi
              engine/build/live_hierarchy_test --threads "$workers" \
                --compiler-no-unroll "${hcp_ir_args[@]}" \
                > "$RUNNER_TEMP/c3-compiler-ir/${workers}-${source_path}-no-unroll/native.txt"
            done
          done

      - name: Restore new cold fixtures and run native PostgreSQL-to-active integration
        run: |
          set -euo pipefail
          git lfs pull --include='data/postgres/snapshots/2026-10-13-letter-seed-validation/*.sql.gz' --exclude=''
          hcp_active_snapshots=data/postgres/snapshots/2026-10-13-letter-seed-validation
          (cd "$hcp_active_snapshots" && printf '%s  %s\n' \
            f8019624a617a84410c0fd927b4947ed87955b48280016af8fb40b35eb8ac121 hcp_core.sql.gz \
            9784ed93d361de61bfb169d13a6e2fd9d2a58eb4dd1ac889b9dc6e0d09e32296 hcp_linguistics.sql.gz \
            | sha256sum --check -)
          hcp_active_image=postgres@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
          hcp_active_container="hcp-active-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker run -d --name "$hcp_active_container" --network none --user postgres \
            --volume "$hcp_active_container:/var/lib/postgresql/data" \
            --entrypoint bash "$hcp_active_image" -c \
            'set -e; initdb -D "$PGDATA" --encoding=UTF8 --locale=C.UTF-8 --auth-local=peer --auth-host=scram-sha-256 > /tmp/init.log; exec postgres -D "$PGDATA" -c listen_addresses=""'
          for hcp_active_attempt in {1..60}; do
            if docker exec --user postgres "$hcp_active_container" pg_isready >/dev/null 2>&1; then break; fi
            sleep 1
          done
          for hcp_active_source in core linguistics; do
            docker exec --user postgres "$hcp_active_container" createdb "hcp_$hcp_active_source"
            gzip -dc "$hcp_active_snapshots/hcp_$hcp_active_source.sql.gz" \
              | docker exec -i --user postgres "$hcp_active_container" psql -X -q -v ON_ERROR_STOP=1 --dbname "hcp_$hcp_active_source"
          done
          bash engine/scripts/run_warm_active_acceptance.sh engine/build \
            "$hcp_active_container" hcp_core hcp_linguistics

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-active-workbench-evidence
          path: |
            engine/build/acceptance-*/native-checks.txt
            engine/build/acceptance-*/cold-*.sha256
            engine/build/Testing/Temporary/LastTest.log
            ${{ runner.temp }}/native-cpu-ctest.log
            ${{ runner.temp }}/c3-compiler-ir/*/native.txt

      - name: Verify CPU-only runtime reports no CUDA requirement
        run: |
          . ./engine/build/engine-env.sh
          ./engine/build/engine_devices --cpu-only
