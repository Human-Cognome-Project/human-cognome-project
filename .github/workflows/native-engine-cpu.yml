name: Native engine CPU reproducibility

on:
  pull_request:
    paths:
      - "engine/**"
      - "kernels/database/warm/**"
      - "kernels/database/codec/**"
      - "tools/viewport/native/**"
      - ".gitmodules"
      - ".github/workflows/native-engine-cpu.yml"
  push:
    branches:
      - "main"
    paths:
      - "engine/**"
      - "kernels/database/warm/**"
      - "kernels/database/codec/**"
      - "tools/viewport/native/**"
      - ".gitmodules"
      - ".github/workflows/native-engine-cpu.yml"
  workflow_dispatch:
    inputs:
      cold_build:
        description: Disable compiler-object reuse for a clean-build witness
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  projection-values:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and test projection and membership values without PostgreSQL or Taichi
        run: |
          cmake -S engine/tests/letter_projection -B /tmp/hcp-projection
          cmake --build /tmp/hcp-projection -j 2
          ctest --test-dir /tmp/hcp-projection --output-on-failure
  native-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      digest: ${{ steps.bundle.outputs.digest }}
      artifact: ${{ steps.bundle.outputs.artifact }}
    env:
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Fetch pinned Taichi dependencies
        run: |
          if ! git submodule update --init --recursive; then
            # The pinned Eigen commit also exists in this mirror. Git still
            # checks out the exact gitlink SHA recorded by the repository.
            git -c 'url.https://github.com/eigen-mirror/eigen.git.insteadOf=https://gitlab.com/libeigen/eigen.git' \
              submodule update --init --recursive
          fi
      - name: Install recovered native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-15 llvm-15-dev ninja-build libx11-dev libpq-dev ccache shellcheck
          echo "CCACHE_DIR=$RUNNER_TEMP/ccache" >> "$GITHUB_ENV"

      - name: Check CI orchestration contracts
        run: |
          shellcheck engine/scripts/hosted_cpu_*.sh engine/scripts/check_hosted_cpu_ci.sh
          bash engine/scripts/check_hosted_cpu_ci.sh
      - name: Identify compiler cache compatibility
        id: toolchain
        run: |
          digest=$(dpkg-query -W -f='${Package}=${Version}\n' clang-15 llvm-15-dev libstdc++-13-dev libc6-dev | sha256sum | cut -d ' ' -f 1)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        if: inputs.cold_build != true
        id: objects
        with:
          path: ${{ env.CCACHE_DIR }}
          key: cpu-objects-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.digest }}-${{ github.sha }}
          restore-keys: cpu-objects-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.digest }}-
      - name: Start compiler cache measurements
        env:
          COLD_BUILD: ${{ inputs.cold_build }}
        run: |
          ccache --zero-stats
          if [ "$COLD_BUILD" = true ]; then echo 'CCACHE_DISABLE=1' >> "$GITHUB_ENV"; fi
      - name: Configure CPU-only Taichi fork
        run: |
          cmake -S engine/taichi -B engine/taichi/build-review -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER=/usr/lib/llvm-15/bin/clang \
            -DCMAKE_CXX_COMPILER=/usr/lib/llvm-15/bin/clang++ \
            -DLLVM_DIR=/usr/lib/llvm-15/lib/cmake/llvm \
            -DCLANG_EXECUTABLE=/usr/lib/llvm-15/bin/clang \
            -DTI_WITH_PYTHON=OFF \
            -DTI_WITH_C_API=ON \
            -DTI_WITH_CUDA=OFF \
            -DTI_WITH_AMDGPU=OFF \
            -DTI_WITH_OPENGL=OFF \
            -DTI_WITH_VULKAN=OFF \
            -DTI_WITH_METAL=OFF \
            -DTI_WITH_DX11=OFF \
            -DTI_WITH_DX12=OFF \
            -DTI_WITH_GGUI=OFF \
            -DTI_WITH_BACKTRACE=OFF \
            -DTI_BUILD_TESTS=OFF \
            -DTI_BUILD_EXAMPLES=OFF \
            -DTI_BUILD_RHI_EXAMPLES=OFF
      - name: Build native Taichi CPU core
        run: |
          cmake --build engine/taichi/build-review \
            --target taichi_c_api -j 2
          test -f engine/taichi/build-review/libtaichi_core_static.a
          test -f engine/taichi/taichi/runtime/llvm/runtime_module/runtime_x64.bc
      - name: Configure HCP native engine against CPU Taichi
        run: |
          cmake -S engine -B engine/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER=/usr/lib/llvm-15/bin/clang++ \
            -DENGINE_TAICHI_ROOT="$GITHUB_WORKSPACE/engine/taichi" -DENGINE_TAICHI_BUILD="$GITHUB_WORKSPACE/engine/taichi/build-review" -DENGINE_TAICHI_RUNTIME_SOURCE="$GITHUB_WORKSPACE/engine/taichi/taichi/runtime/llvm/runtime_module" -DHCP_WITH_CUDA_QUALIFICATION=OFF -DENGINE_LLVM_CONFIG=/usr/lib/llvm-15/bin/llvm-config \
            -DENGINE_TAICHI_CUDA=OFF -DHCP_WITH_WARM_INTEGRATION=ON -DHCP_WITH_VIEWPORT=ON
      - name: Build HCP native engine
        run: |
          cmake --build engine/build -j 2
      - name: Ignore stale CUDA archives in a CPU Taichi build
        run: |
          for archive in \
            taichi/codegen/cuda/libcuda_codegen.a \
            taichi/runtime/cuda/libcuda_runtime.a \
            taichi/rhi/cuda/libcuda_rhi.a; do
            mkdir -p "engine/taichi/build-review/$(dirname "$archive")"
            touch "engine/taichi/build-review/$archive"
          done
          mkdir -p "$RUNNER_TEMP/taichi-runtime-probe"
          cp engine/taichi/taichi/runtime/llvm/runtime_module/runtime_x64.bc \
            "$RUNNER_TEMP/taichi-runtime-probe/runtime_x64.bc"
          touch "$RUNNER_TEMP/taichi-runtime-probe/runtime_cuda.bc"
          cmake -S engine -B engine/build-stale-probe -G Ninja \
            -DCMAKE_CXX_COMPILER=/usr/lib/llvm-15/bin/clang++ \
            -DENGINE_TAICHI_RUNTIME_SOURCE="$RUNNER_TEMP/taichi-runtime-probe" \
            -DENGINE_TAICHI_CUDA=AUTO > "$RUNNER_TEMP/backend-probe.log"
          grep -q 'Engine CUDA     : FALSE' "$RUNNER_TEMP/backend-probe.log"
      - name: Verify CPU-only runtime reports no CUDA requirement
        run: |
          . ./engine/build/engine-env.sh
          ./engine/build/engine_devices --cpu-only

      - name: Package this run's build
        id: bundle
        run: |
          bash engine/scripts/hosted_cpu_bundle.sh pack "$RUNNER_TEMP/native-build.tar.gz"
          echo "digest=$(sha256sum "$RUNNER_TEMP/native-build.tar.gz" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "artifact=native-cpu-build-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.bundle.outputs.artifact }}
          path: ${{ runner.temp }}/native-build.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Record compiler cache measurements
        if: always()
        run: ccache --show-stats | tee "$RUNNER_TEMP/ccache.txt" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-cpu-build-evidence
          path: |
            ${{ runner.temp }}/ccache.txt
            ${{ runner.temp }}/backend-probe.log
            engine/build/ci-provenance
      # Only trusted main builds publish the shared cache. PRs restore it.
      - uses: actions/cache/save@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.objects.outputs.cache-hit != 'true' && inputs.cold_build != true
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.objects.outputs.cache-primary-key }}

  native-regression:
    needs: native-build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - name: Install native execution dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-15 llvm-15-dev libx11-6 libpq5
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.native-build.outputs.artifact }}
          path: ${{ runner.temp }}/native-build
      - name: Verify and unpack this run's CPU build
        env:
          BUILD_SHA256: ${{ needs.native-build.outputs.digest }}
        run: bash engine/scripts/hosted_cpu_bundle.sh restore "$RUNNER_TEMP/native-build/native-build.tar.gz" "$BUILD_SHA256"
      - name: Run disjoint functional tests serially
        env:
          SHARD: ${{ matrix.shard }}
        run: bash engine/scripts/hosted_cpu_regression.sh "$SHARD" "$RUNNER_TEMP/regression"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-cpu-regression-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/regression
            engine/build/Testing/Temporary/LastTest.log
          if-no-files-found: error

  native-compiler:
    needs: native-build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        workers: [1, 2]
        source-path: [bulk, direct]
    steps:
      - uses: actions/checkout@v4
      - name: Install native execution dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-15 llvm-15-dev libx11-6 libpq5
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.native-build.outputs.artifact }}
          path: ${{ runner.temp }}/native-build
      - name: Verify and unpack this run's CPU build
        env:
          BUILD_SHA256: ${{ needs.native-build.outputs.digest }}
        run: bash engine/scripts/hosted_cpu_bundle.sh restore "$RUNNER_TEMP/native-build/native-build.tar.gz" "$BUILD_SHA256"
      - name: Collect and audit modules, then exercise no-unroll modes
        env:
          HCP_WORKERS: ${{ matrix.workers }}
          HCP_SOURCE_PATH: ${{ matrix.source-path }}
        run: bash engine/scripts/hosted_cpu_compiler.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-c3-compiler-ir-${{ matrix.workers }}-${{ matrix.source-path }}
          path: ${{ runner.temp }}/c3-compiler-ir
          if-no-files-found: error

  native-database:
    needs: native-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install native execution dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-15 llvm-15-dev libx11-6 libpq5
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.native-build.outputs.artifact }}
          path: ${{ runner.temp }}/native-build
      - name: Verify and unpack this run's CPU build
        env:
          BUILD_SHA256: ${{ needs.native-build.outputs.digest }}
        run: bash engine/scripts/hosted_cpu_bundle.sh restore "$RUNNER_TEMP/native-build/native-build.tar.gz" "$BUILD_SHA256"
      - name: Restore new cold fixtures and run native PostgreSQL-to-active integration
        run: |
          set -euo pipefail
          git lfs pull --include='data/postgres/snapshots/2026-10-13-letter-seed-validation/*.sql.gz' --exclude=''
          hcp_active_snapshots=data/postgres/snapshots/2026-10-13-letter-seed-validation
          (cd "$hcp_active_snapshots" && printf '%s  %s\n' \
            f8019624a617a84410c0fd927b4947ed87955b48280016af8fb40b35eb8ac121 hcp_core.sql.gz \
            9784ed93d361de61bfb169d13a6e2fd9d2a58eb4dd1ac889b9dc6e0d09e32296 hcp_linguistics.sql.gz \
            | sha256sum --check -)
          hcp_active_image=postgres@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
          hcp_active_container="hcp-active-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker run -d --name "$hcp_active_container" --network none --user postgres \
            --volume "$hcp_active_container:/var/lib/postgresql/data" \
            --entrypoint bash "$hcp_active_image" -c \
            'set -e; initdb -D "$PGDATA" --encoding=UTF8 --locale=C.UTF-8 --auth-local=peer --auth-host=scram-sha-256 > /tmp/init.log; exec postgres -D "$PGDATA" -c listen_addresses=""'
          for _hcp_active_attempt in {1..60}; do
            if docker exec --user postgres "$hcp_active_container" pg_isready >/dev/null 2>&1; then break; fi
            sleep 1
          done
          for hcp_active_source in core linguistics; do
            docker exec --user postgres "$hcp_active_container" createdb "hcp_$hcp_active_source"
            gzip -dc "$hcp_active_snapshots/hcp_$hcp_active_source.sql.gz" \
              | docker exec -i --user postgres "$hcp_active_container" psql -X -q -v ON_ERROR_STOP=1 --dbname "hcp_$hcp_active_source"
          done
          bash engine/scripts/run_warm_active_acceptance.sh engine/build \
            "$hcp_active_container" hcp_core hcp_linguistics

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-active-workbench-evidence
          path: |
            engine/build/acceptance-*/native-checks.txt
            engine/build/acceptance-*/cold-*.sha256
          if-no-files-found: error

  # Keep the existing required-check name. Skips/failures never count as success.
  native-cpu:
    if: always()
    needs: [native-build, native-regression, native-compiler, native-database]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every CPU gate
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$RESULTS" | jq -e 'all(.[]; .result == "success")'
